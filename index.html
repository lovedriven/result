<style>
  :root{--teal:#3AAA94;--navy:#15303F;--bg:#f2f7f6;--card:#fff;--text:#15303F;--muted:#5d727c;--line:#d8e5e2;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1c24;--card:#15303F;--text:#eaf3f1;--muted:#a8bec5;--line:#2a4a58}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{background:#fff;border-bottom:4px solid var(--teal);text-align:center;padding:14px 12px}
  header img{max-width:min(420px,80vw);height:auto}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:22px 16px 30px}
  h1{font-size:1.45rem;margin:6px 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input,select{width:100%;padding:13px 14px;font-size:1rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
  input:focus,select:focus{outline:3px solid rgba(58,170,148,.35);border-color:var(--teal)}
  select:disabled{opacity:.55}
  .hint{font-size:.85rem;color:var(--muted);margin-top:4px}
  button,.btn{display:inline-block;border:0;border-radius:10px;padding:14px 18px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
  .primary{width:100%;margin-top:20px;background:var(--teal);color:#fff}
  .primary:disabled{opacity:.55;cursor:default}
  .ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
  #msg{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
  #msg.err{display:block;background:rgba(179,38,30,.1);color:var(--err);border:1px solid rgba(179,38,30,.3)}
  #msg.info{display:block;background:rgba(58,170,148,.12);border:1px solid rgba(58,170,148,.35)}
  #msg button{margin-left:8px;padding:0;background:none;color:inherit;text-decoration:underline;font-size:inherit}

  /* student found */
  .found{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border:1.5px solid var(--teal);border-radius:12px;background:rgba(58,170,148,.08)}
  .avatar{width:72px;height:72px;flex:none;border-radius:50%;overflow:hidden;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.4rem;border:3px solid var(--teal)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .found small{display:block;color:var(--teal);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
  .found .name{font-size:1.15rem;font-weight:700;line-height:1.25;margin:2px 0 4px}
  .linkbtn{padding:0;background:none;color:var(--muted);font-size:.85rem;font-weight:600;text-decoration:underline}
  #rest.lock{opacity:.45;pointer-events:none}

  #result{display:none;margin-top:18px}
  #result .who{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  #result .who .name{font-size:1.2rem;font-weight:700;line-height:1.25}
  #result .who .sid{color:var(--muted);font-size:.9rem}
  #result .meta{margin:6px 0 0;color:var(--muted);font-size:.92rem}
  #result .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  #result .row>*{flex:1 1 160px}
  
  .email-box{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  
  #preview{display:none;width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:14px;background:#fff}
  @media (min-width:760px){#preview.on{display:block}}
  footer{text-align:center;padding:18px 12px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
  footer a{color:var(--teal);font-weight:600}
</style>
</head>

<style>
  :root{--teal:#3AAA94;--navy:#15303F;--bg:#f2f7f6;--card:#fff;--text:#15303F;--muted:#5d727c;--line:#d8e5e2;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1c24;--card:#15303F;--text:#eaf3f1;--muted:#a8bec5;--line:#2a4a58}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{background:#fff;border-bottom:4px solid var(--teal);text-align:center;padding:14px 12px}
  header img{max-width:min(420px,80vw);height:auto}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:22px 16px 30px}
  h1{font-size:1.45rem;margin:6px 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input,select{width:100%;padding:13px 14px;font-size:1rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
  input:focus,select:focus{outline:3px solid rgba(58,170,148,.35);border-color:var(--teal)}
  select:disabled{opacity:.55}
  .hint{font-size:.85rem;color:var(--muted);margin-top:4px}
  button,.btn{display:inline-block;border:0;border-radius:10px;padding:14px 18px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
  .primary{width:100%;margin-top:20px;background:var(--teal);color:#fff}
  .primary:disabled{opacity:.55;cursor:default}
  .ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
  #msg{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
  #msg.err{display:block;background:rgba(179,38,30,.1);color:var(--err);border:1px solid rgba(179,38,30,.3)}
  #msg.info{display:block;background:rgba(58,170,148,.12);border:1px solid rgba(58,170,148,.35)}
  #msg button{margin-left:8px;padding:0;background:none;color:inherit;text-decoration:underline;font-size:inherit}

  /* student found */
  .found{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border:1.5px solid var(--teal);border-radius:12px;background:rgba(58,170,148,.08)}
  .avatar{width:72px;height:72px;flex:none;border-radius:50%;overflow:hidden;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.4rem;border:3px solid var(--teal)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .found small{display:block;color:var(--teal);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
  .found .name{font-size:1.15rem;font-weight:700;line-height:1.25;margin:2px 0 4px}
  .linkbtn{padding:0;background:none;color:var(--muted);font-size:.85rem;font-weight:600;text-decoration:underline}
  #rest.lock{opacity:.45;pointer-events:none}

  #result{display:none;margin-top:18px}
  #result .who{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  #result .who .name{font-size:1.2rem;font-weight:700;line-height:1.25}
  #result .who .sid{color:var(--muted);font-size:.9rem}
  #result .meta{margin:6px 0 0;color:var(--muted);font-size:.92rem}
  #result .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  #result .row>*{flex:1 1 160px}
  
  .email-box{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  
  #preview{display:none;width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:14px;background:#fff}
  @media (min-width:760px){#preview.on{display:block}}
  footer{text-align:center;padding:18px 12px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
  footer a{color:var(--teal);font-weight:600}
</style>
</head>
