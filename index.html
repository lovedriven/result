<style>
  :root{--teal:#3AAA94;--navy:#15303F;--bg:#f2f7f6;--card:#fff;--text:#15303F;--muted:#5d727c;--line:#d8e5e2;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1c24;--card:#15303F;--text:#eaf3f1;--muted:#a8bec5;--line:#2a4a58}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{background:#fff;border-bottom:4px solid var(--teal);text-align:center;padding:14px 12px}
  header img{max-width:min(420px,80vw);height:auto}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:22px 16px 30px}
  h1{font-size:1.45rem;margin:6px 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input,select{width:100%;padding:13px 14px;font-size:1rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
  input:focus,select:focus{outline:3px solid rgba(58,170,148,.35);border-color:var(--teal)}
  select:disabled{opacity:.55}
  .hint{font-size:.85rem;color:var(--muted);margin-top:4px}
  button,.btn{display:inline-block;border:0;border-radius:10px;padding:14px 18px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
  .primary{width:100%;margin-top:20px;background:var(--teal);color:#fff}
  .primary:disabled{opacity:.55;cursor:default}
  .ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
  #msg{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
  #msg.err{display:block;background:rgba(179,38,30,.1);color:var(--err);border:1px solid rgba(179,38,30,.3)}
  #msg.info{display:block;background:rgba(58,170,148,.12);border:1px solid rgba(58,170,148,.35)}
  #msg button{margin-left:8px;padding:0;background:none;color:inherit;text-decoration:underline;font-size:inherit}

  /* student found */
  .found{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border:1.5px solid var(--teal);border-radius:12px;background:rgba(58,170,148,.08)}
  .avatar{width:72px;height:72px;flex:none;border-radius:50%;overflow:hidden;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.4rem;border:3px solid var(--teal)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .found small{display:block;color:var(--teal);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
  .found .name{font-size:1.15rem;font-weight:700;line-height:1.25;margin:2px 0 4px}
  .linkbtn{padding:0;background:none;color:var(--muted);font-size:.85rem;font-weight:600;text-decoration:underline}
  #rest.lock{opacity:.45;pointer-events:none}

  #result{display:none;margin-top:18px}
  #result .who{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  #result .who .name{font-size:1.2rem;font-weight:700;line-height:1.25}
  #result .who .sid{color:var(--muted);font-size:.9rem}
  #result .meta{margin:6px 0 0;color:var(--muted);font-size:.92rem}
  #result .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  #result .row>*{flex:1 1 160px}
  #preview{display:none;width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:14px;background:#fff}
  @media (min-width:760px){#preview.on{display:block}}
  footer{text-align:center;padding:18px 12px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
  footer a{color:var(--teal);font-weight:600}
</style>
</head>

<main>
  <h1>Student Results</h1>
  <p class="sub">Enter your child's student ID, then choose the academic year and term.</p>

  <div class="card">
    <form id="form" novalidate>
      <label for="sid">Student ID</label>
      <input id="sid" autocomplete="off" autocapitalize="characters" placeholder="e.g. CCSS/000/25">


      <div class="found" id="found" hidden>
        <div class="avatar" id="avatar"></div>
        <div>
          <small>Student found</small>
          <div class="name" id="fname"></div>
          <button type="button" class="linkbtn" id="notme">Not your child? Change ID</button>
        </div>
      </div>

      <div id="rest" class="lock">
        <label for="year">Academic year</label>
        <select id="year" disabled><option value="">Loading…</option></select>

        <label for="term">Term</label>
        <select id="term" disabled><option value="">Choose a year first</option></select>
      </div>

      <button id="go" class="primary" type="submit" disabled>View report</button>
      <div id="msg" role="alert" aria-live="polite"></div>
    </form>

    <div id="result">
      <div class="who">
        <div class="avatar" id="ravatar"></div>
        <div><div class="name" id="rname"></div><div class="sid" id="rsid"></div></div>
      </div>
      <strong id="rtitle"></strong>
      <div class="meta" id="rintake"></div>
      <div class="row">
        <a id="open" class="btn primary" style="margin:0" target="_blank" rel="noopener">Open report</a>
        <a id="dl" class="btn ghost">Download PDF</a>
      </div>
      <iframe id="preview" title="Report preview"></iframe>
      <button type="button" class="linkbtn" id="again" style="margin-top:16px">&larr; Check another report</button>
    </div>
  </div>
</main>

<footer>
  Chikondi Christian Secondary School is a program of
  <a href="https://lovedrivenministries.org/" target="_blank" rel="noopener">LoveDriven Ministries</a><br>
  Walk with me &middot; Matthew 11:28-30
</footer>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxOnPVjw4hefUA0wFtYg25rkWjxtdt2rW9feSZugjMuZkg2unFrECd2nzmBy9sNw3finA/exec';

const $ = id => document.getElementById(id);
let blobUrl = null, student = null;

/* ---------- helpers ---------- */
async function call(params, ms = 45000){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(API + '?' + new URLSearchParams(params), { signal: ctl.signal });
    if(!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
function say(text, kind, retry){
  const m = $('msg'); m.className = text ? kind : ''; m.textContent = text || '';
  if(text && retry){ const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Try again'; b.onclick = retry; m.appendChild(b); }
}
function fill(sel, items, placeholder){
  sel.innerHTML = '';
  const o = document.createElement('option'); o.value = ''; o.textContent = placeholder; sel.appendChild(o);
  items.forEach(v => { const x = document.createElement('option'); x.value = v; x.textContent = v; sel.appendChild(x); });
}
function setGo(){ $('go').disabled = !student; $('go').textContent = 'View report'; }   // enabled only after the student is found
function busy(on, txt){ if(on){ $('go').disabled = true; $('go').textContent = txt; } else setGo(); }
function initials(n){ return String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function avatar(el, s){
  el.innerHTML = '';
  if(s.photo){
    const i = new Image(); i.alt = ''; i.src = s.photo;
    i.onerror = () => { el.textContent = initials(s.name); };
    el.appendChild(i);
  } else el.textContent = initials(s.name);
}

/* ---------- student ID: CCSS/000/25 ---------- */
const sid = $('sid');
const digits = () => sid.value.replace(/\D/g, '');            // CCSS has no digits, so this keeps 000 + 25
const idValid = () => digits().length === 5;
const fullId = () => { const d = digits(); return 'CCSS/' + d.slice(0, 3) + '/' + d.slice(3, 5); };
const intakeYear = () => idValid() ? 2000 + Number(digits().slice(3, 5)) : null;

function lock(on){
  $('rest').classList.toggle('lock', on);
  $('year').disabled = on;
  if(on) $('term').disabled = true; else if($('year').value) loadTerms();
}
function resetStudent(){
  if(!student) return;
  student = null; $('found').hidden = true; lock(true); setGo(); say('');
}
let seq = 0, timer = null;
sid.addEventListener('input', () => {
  seq++; clearTimeout(timer);                       // cancel any lookup still in progress
  if(student) resetStudent(); else say('');
  if(idValid()) timer = setTimeout(findStudent, 300);   // look the student up automatically once the ID is complete
});
sid.addEventListener('blur', () => { if(idValid()) sid.value = fullId(); });   // tidy up to CCSS/012/25
$('notme').addEventListener('click', () => { seq++; resetStudent(); sid.value = ''; sid.focus(); });

/* ---------- load years & terms ---------- */
async function init(){
  say('');
  try{
    const yrs = await call({action:'years'});
    fill($('year'), yrs.years || [], 'Choose year');
    $('year').disabled = true;
    if((yrs.years || []).length === 1) $('year').value = yrs.years[0];
  }catch(e){
    fill($('year'), [], 'Unavailable');
    say('Cannot reach the results service. Check your internet connection.', 'err', init);
  }
}
async function loadTerms(){
  const y = $('year').value, t = $('term');
  if(!y){ t.disabled = true; fill(t, [], 'Choose a year first'); return; }
  t.disabled = true; fill(t, [], 'Loading…');
  try{
    const r = await call({action:'terms', year:y});
    fill(t, r.terms || [], (r.terms || []).length ? 'Choose term' : 'No terms yet'); t.disabled = !(r.terms || []).length;
  }catch(e){ fill(t, [], 'Unavailable'); say('Could not load the terms.', 'err', loadTerms); }
}
$('year').addEventListener('change', () => { say(''); loadTerms(); });

/* ---------- step 1: find the student (runs automatically when the ID is complete) ---------- */
async function findStudent(){
  const asked = fullId(), my = ++seq;
  say('Looking for student…', 'info');
  try{
    const r = await call({ action:'student', id: asked });
    if(my !== seq) return;                           // ID was changed while waiting
    if(!r.ok) return say(r.error, 'err');
    student = { name: r.name, photo: r.photo || '' };
    avatar($('avatar'), student); $('fname').textContent = student.name; $('found').hidden = false;
    sid.value = asked; lock(false); say(''); setGo();
  }catch(e){
    if(my !== seq) return;
    say(e.name === 'AbortError' ? 'The request took too long.' : 'Could not look up the student.', 'err', findStudent);
  }
}

/* ---------- step 2: get the report ---------- */
async function getReport(){
  const year = $('year').value, term = $('term').value, joined = intakeYear();
  if(!year) return say('Please choose the academic year.', 'err');
  if(!term) return say('Please choose the term.', 'err');
  const start = parseInt(year, 10);
  if(joined && start && start < joined)
    return say('This student joined in ' + joined + ', so there are no reports for ' + year + '. Please choose a later year.', 'err');

  busy(true, 'Looking for the report…'); say('This can take a few seconds…', 'info');
  try{
    const r = await call({ action:'result', id: fullId(), year, term });
    if(!r.ok) return say(r.error, 'err');
    const bytes = Uint8Array.from(atob(r.data), c => c.charCodeAt(0));
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));

    avatar($('ravatar'), student); $('rname').textContent = student.name; $('rsid').textContent = fullId();
    $('rtitle').textContent = r.form + '  |  ' + r.term + '  |  ' + r.year;
    $('rintake').textContent = joined ? 'Year of intake: ' + joined : '';
    $('open').href = blobUrl;
    $('dl').href = blobUrl;
    $('dl').download = (fullId() + '_' + r.term + '_' + r.year).replace(/[^\w.-]+/g, '_') + '.pdf';
    $('preview').src = blobUrl; $('preview').className = 'on';
    say(''); $('form').hidden = true; $('result').style.display = 'block';
    $('result').scrollIntoView({behavior:'smooth'});
  }catch(e){
    say(e.name === 'AbortError' ? 'The request took too long. Please try again.' : 'Something went wrong. Please try again.', 'err');
  }finally{ busy(false); }
}

$('form').addEventListener('submit', ev => {
  ev.preventDefault(); say('');
  if(!idValid()) return say('Enter the student ID as three digits and two digits, for example CCSS/000/25.', 'err'), sid.focus();
  return student ? getReport() : findStudent();
});

$('again').addEventListener('click', () => {
  $('result').style.display = 'none'; $('form').hidden = false; $('preview').removeAttribute('src');
  if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  student = null; $('found').hidden = true; lock(true);
  sid.value = ''; setGo(); sid.focus();
});

setGo();
init();
</script>
</body>
</html>
